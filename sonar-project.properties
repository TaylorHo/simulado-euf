# SonarQube project configuration
# https://docs.sonarsource.com/sonarqube-server/latest/project-administration/analysis-scope/

# Required — set these to match your SonarQube project
sonar.projectKey=simulado-euf
sonar.projectName=simulado-euf

# Exclude exam question data from copy-paste duplication detection
sonar.cpd.exclusions=src/lib/data/**

# Issues to ignore
sonar.issue.ignore.multicriteria=e1,e2

# This issue is due of hardcoded version numbers, but these version numbers are managed by Rust/Tauri.
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S6624
sonar.issue.ignore.multicriteria.e1.resourceKey=src-tauri/gen/android/**/build.gradle.kts

# This issue is due to the usage of Math.random() in the code, but it's okay to use Math.random() in cases that doesn't deal with security.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=src/lib/**/*.ts
