<!doctype html>
<html lang="pt-BR">
	<head>
		<title>Simulado EUF</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.ico" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Simulado EUF" />
		<meta property="og:locale" content="pt_BR" />
		<meta property="og:title" content="Simulado EUF - Exame Unificado de Física" />
		<meta
			property="og:description"
			content="Plataforma gratuita e de código aberto com simulados e flashcards baseados em questões reais do EUF."
		/>
		<meta property="og:image" content="https://euf.hoffmann.io/assets/og-image.jpeg" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://euf.hoffmann.io/assets/og-image.jpeg" />
		<script>
			// Load saved theme before rendering
			(function () {
				const savedTheme = localStorage.getItem('theme');
				if (savedTheme) {
					document.documentElement.dataset.theme = savedTheme;
				} else {
					// Optional: auto-detect system preference
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
